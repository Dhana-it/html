<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Left Input Fields</h1>
    
    <form> 
        <label for="percent">Select Percentage</label>
        <input type="range" value="0" step="10" title="value">

        <br><br>

        <label for="pt">Party Time Schedule</label>
        <input type="datetime-local" name="PartyTime" id="pt">

        <br><br> 

        <label for="w">Select Week</label>
        <input type="week" name="week" id="w">

        <br><br>

        <label for="c">Select Your Favourite Color</label>
        <input type="color" name="" id="c">

        <br><br>

        <label for="">Select Tech Skills</label>

        <input type="checkbox" name="" id="a">
        <label for="a">Python</label>

        <input type="checkbox" name="" id="b">
        <label for="b">Java</label>
        
        <input type="checkbox" name="" id="c" checked>
        <label for="c">Webtech</label>

        <br><br>

        <label for="aadhar">Aadhar Number</label>
        <input type="text"
        name="aadhar card"
        id="aadhar"
        value="1213 2331 0978"
        readonly>

        <br><br>

        <!-- By default for this button type will be submit inside the form-->
         <button type="submit">SUBMIT</button>
        <!--  -->
         <input type="reset" value="Reset form">
         <input type="button" value="Normal Buttom">
         <input type="submit" value="Submit Button">
    </form>

    <button>Saran</button>
</body>
</html>
