<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1><mark>Check List in HTML</mark></h1>
    <table border>
        <caption>Check list</caption>
        <thead>
            <tr>
                <td>Sl.No.</td>
                <td>Items</td>
                <td>Price</td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Shirt</td>
                <td rowspan="2">₹6200</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Jeans</td>
                
            </tr>
            <tr>
                <td>3</td>
                <td>Rc car</td>
                <td rowspan="2">₹12800</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Cells</td>
                
            </tr>
            <td colspan="2">Total</td>
            <td>₹1900</td>
        </tbody>

    </table>
</body>
</html>
